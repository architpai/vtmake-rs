[package]
name = "vtmake-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "vtmake join, decode, enumerate, overzoom and json-tool: ports of tippecanoe's tools"

[dependencies]
vtmake-mvt = { path = "../vtmake-mvt" }
vtmake-parse = { path = "../vtmake-parse" }
vtmake-geom = { path = "../vtmake-geom" }
vtmake-out = { path = "../vtmake-out" }
vtmake-core = { path = "../vtmake-core" }
vtmake-filter = { path = "../vtmake-filter" }
vtmake-wagyu = { path = "../vtmake-wagyu" }
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1"
